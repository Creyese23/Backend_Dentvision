# ---- Base de datos H2 en memoria para tests ----
spring.datasource.url=jdbc:h2:mem:dentvision_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Deshabilitar Flyway en tests (H2 usa DDL auto)
spring.flyway.enabled=false

# JWT para tests
app.jwt.secret=dGVzdFNlY3JldEtleVBhcmFEZW50dmlzaW9uUHJveWVjdG8xMjM0NTY3ODkwMTIzNDU2
app.jwt.expiration-ms=3600000

# CORS
cors.allowed-origins=http://localhost:3000
