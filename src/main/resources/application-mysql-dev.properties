# ---- Datasource MySQL (desarrollo) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dentvision_db}?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway — habilitado en desarrollo para iterar migraciones
spring.flyway.enabled=true

# Logging SQL en desarrollo
logging.level.org.hibernate.SQL=DEBUG
