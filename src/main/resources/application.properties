spring.application.name=Dentvision_Backend

# Puerto configurable por .env (default 8080)
server.port=${SERVER_PORT:8080}

# ---- JPA / Hibernate ----
# IMPORTANTE: con Flyway activo, cambiar ddl-auto a "validate" o "none"
# para que Flyway sea el responsable de crear/migrar el schema.
# En desarrollo puede quedar "update" temporalmente.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- Flyway (PRIORIDAD MEDIA) ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ---- Seeding inicial ----
# Deshabilitado ahora que Flyway inserta los datos semilla en V1
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Jackson ----
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=America/Bogota
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ---- Manejo de errores ----
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always

# ---- Logging (PRIORIDAD MEDIA) ----
logging.level.org.springframework.security=INFO
logging.level.co.edu.sena.Dentvision_Backend=DEBUG
logging.level.org.flywaydb=INFO
# Formato de log: timestamp | nivel | hilo | clase | mensaje
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Archivo de log (descomentar en produccion)
# logging.file.name=logs/dentvision.log
# logging.logback.rollingpolicy.max-file-size=10MB
# logging.logback.rollingpolicy.max-history=30

# ---- CORS ----
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}

# ---- Swagger / SpringDoc ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
